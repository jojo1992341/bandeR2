stages:
  - security_and_test
  - build

dependency_scan:
  stage: security_and_test
  image: python:3.13
  script:
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt pip-audit
    - pip-audit -r backend/requirements.txt --no-deps

npm_audit:
  stage: security_and_test
  image: node:20
  script:
    - cd frontend && npm ci
    - npm audit --audit-level=high || true

performance_budgets_and_slos:
  stage: security_and_test
  image: python:3.13
  script:
    - pip install -r backend/requirements.txt pytest pytest-asyncio httpx pyotp requests
    - python3 ci/check_performance_budgets.py
    - PYTHONPATH=backend pytest backend/tests/integration/test_performance_slo_budget.py -v

owasp_and_integration_tests:
  stage: security_and_test
  image: python:3.13
  script:
    - pip install -r backend/requirements.txt pytest pytest-asyncio httpx pyotp requests
    - PYTHONPATH=backend pytest backend/tests/ -v


# §10.5 — Contrat OpenAPI 3.1 : régénération sans diff + validation + contract testing
openapi_contract:
  stage: security_and_test
  image: python:3.13
  script:
    - pip install -r backend/requirements.txt openapi-spec-validator pytest
    - PYTHONPATH=backend python3 backend/scripts/generate_openapi.py
    - git diff --exit-code docs/openapi.json || (echo "Dérive de contrat : régénérer docs/openapi.json" && exit 1)
    - PYTHONPATH=backend pytest backend/tests/unit/test_openapi_contract.py -v

# §9.7 — Industrialisation des migrations & fixtures.
# Démarre un PostgreSQL 16 embarqué (pgserver), monte la chaîne Alembic depuis
# une base vide jusqu'à `head`, charge les fixtures versionnées, effectue un
# downgrade/upgrade supporté et valide l'intégrité des données.
migrations_and_fixtures_postgres:
  stage: security_and_test
  image: python:3.13
  script:
    - pip install -r backend/requirements.txt -r backend/requirements-dev.txt
    - PYTHONPATH=backend pytest backend/tests/integration/test_migrations_and_fixtures.py backend/tests/unit/test_migration_governance.py -v

# §11.x — Tests d'intégration du pipeline IA (audio/média/transcription/E2E).
# Provisionne l'infrastructure externe (ffmpeg + MinIO + faster_whisper) pour que
# les 6 tests pipeline (ignorés sinon) s'exécutent réellement et passent.
# MinIO tourne en conteneur sur localhost:9000 (les tests y accèdent en dur).
pipeline_integration_tests:
  stage: security_and_test
  image: python:3.13
  script:
    - apt-get update -qq && apt-get install -y -qq ffmpeg wget ca-certificates
    # MinIO (serveur + client mc) sur localhost:9000
    - wget -q https://dl.min.io/server/minio/release/linux-amd64/minio -O /usr/local/bin/minio
    - chmod +x /usr/local/bin/minio
    - wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc
    - chmod +x /usr/local/bin/mc
    - pip install -r backend/requirements.txt faster_whisper
    - MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin minio server /tmp/minio-data --console-address ":9001" >/tmp/minio.log 2>&1 &
    - sleep 4
    - mc alias set local http://localhost:9000 minioadmin minioadmin
    - mc mb local/rythmoai-media || true
    - mc mb local/rythmoai-processing || true
    - PYTHONPATH=backend pytest backend/tests/integration/test_audio_pipeline.py backend/tests/integration/test_media_upload.py backend/tests/integration/test_transcription.py backend/tests/integration/test_pipeline_e2e.py backend/tests/integration/test_forced_alignment.py backend/tests/integration/test_cd_pipeline_and_e2e_critical_journey.py -v
