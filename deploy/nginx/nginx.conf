# Configuration Nginx production prête à l'emploi — RythmoAI v2 (§15.7 & §18.4)
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip / Brotli compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen       80;
        listen       443 ssl http2;
        server_name  localhost;

        # TLS 1.3 obligatoire (§15.4 / §15.7)
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        # En-têtes de sécurité HTTP stricts servis par Nginx (§15.7)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-ancestors 'none';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Reverse proxy vers backend FastAPI
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-SSL-Protocol $ssl_protocol;
        }

        location /auth/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-SSL-Protocol $ssl_protocol;
        }

        # Frontend statique
        location / {
            root   /home/user/bandeR2/frontend/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
