# Configuration pytest pour RythmoAI Backend (§18.4 CDC)

[pytest]
# Ajouter le dossier backend au chemin Python
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marqueurs personnalisés
markers =
    slow: marque les tests lents
    integration: tests d'intégration nécessitant PostgreSQL
    unit: tests unitaires avec SQLite
    asyncio: tests asynchrones

# Options par défaut
asyncio_mode = auto
addopts = -v --tb=short

# Timeout par défaut pour les tests (secondes)
timeout = 30

# Filtrer les warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
